<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs dos Professores — ETER NEWS</title>
    <meta name="theme-color" content="#000000">


    <!-- Favicon -->
    <link rel="icon" href="LOGOS/icon_EterNews-preto.ico" media="(prefers-color-scheme: light)">
    <link rel="icon" href="icon/icon_EterNews-branco.ico" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    :root {
        --color-bg:#000; --color-surface-1:#0d0d0d; --color-surface-2:#141414; --color-surface-3:#1e1e1e;
        --color-border:rgba(255,255,255,0.08); --color-border-hover:rgba(255,255,255,0.22);
        --color-white:#fff; --color-gray-300:#b0b0b0; --color-gray-500:#6b6b6b;
        --font-base:'Inter',sans-serif;
        --text-xs:0.72rem; --text-sm:0.875rem; --text-base:1rem; --text-lg:1.125rem; --text-xl:1.35rem;
        --text-2xl:1.625rem; --text-3xl:2rem; --text-4xl:2.75rem;
        --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-16:64px;
        --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
        --shadow-md:0 4px 16px rgba(0,0,0,0.6);
        --t-fast:150ms ease; --t-base:260ms ease;
        --max-w:1140px; --nav-h:68px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--font-base); background:var(--color-bg); color:var(--color-white); line-height:1.6;
        -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    img { display:block; max-width:100%; height:auto; }
    a { color:inherit; text-decoration:none; }
    h1,h2,h3 { line-height:1.2; font-weight:700; }

    /* NAVBAR (mesmo do index) */
    .site-header { position:fixed; top:0; left:0; right:0; z-index:1000; height:var(--nav-h);
        background:rgba(0,0,0,0.72); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
        border-bottom:1px solid var(--color-border); transition:background var(--t-base); }
    .site-header.scrolled { background:rgba(0,0,0,0.97); }
    .nav-inner { max-width:var(--max-w); margin:0 auto; height:100%; display:flex; align-items:center; gap:var(--sp-6); padding:0 var(--sp-6); }
    .nav-logo { display:flex; align-items:center; gap:var(--sp-3); flex-shrink:0; }
    .nav-logo img { height:38px; width:auto; }
    .nav-logo-text { font-size:var(--text-xl); font-weight:900; letter-spacing:0.04em; }
    .nav-links { display:flex; align-items:center; gap:2px; flex:1; }
    .nav-links a { font-size:var(--text-xs); font-weight:600; letter-spacing:0.03em; color:var(--color-gray-300);
        padding:var(--sp-2) var(--sp-3); border-radius:var(--radius-sm); white-space:nowrap; transition:color var(--t-fast), background var(--t-fast); }
    .nav-links a:hover { color:#fff; background:rgba(255,255,255,0.08); }
    .nav-hamburger { display:none; flex-direction:column; justify-content:center; gap:5px; width:40px; height:40px; cursor:pointer;
        padding:var(--sp-2); border-radius:var(--radius-sm); background:transparent; border:none; margin-left:auto; }
    .nav-hamburger span { display:block; width:100%; height:2px; background:#fff; border-radius:2px; transition:transform var(--t-base), opacity var(--t-base); }
    .nav-hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity:0; }
    .nav-hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
    .nav-mobile-panel { display:none; position:fixed; top:var(--nav-h); left:0; right:0; background:rgba(5,5,5,0.97);
        backdrop-filter:blur(20px); z-index:999; padding:var(--sp-6); flex-direction:column; gap:var(--sp-2); border-bottom:1px solid var(--color-border); }
    .nav-mobile-panel.open { display:flex; }
    .nav-mobile-panel a { font-weight:600; color:var(--color-gray-300); padding:var(--sp-3) var(--sp-4); border-radius:var(--radius-md); }
    .nav-mobile-panel a:hover { color:#fff; background:rgba(255,255,255,0.06); }

    .layout-container { max-width:var(--max-w); margin:0 auto; padding:0 var(--sp-6); }
    main { padding-top:var(--nav-h); min-height:70vh; }
    .animar { animation:fadeInUp .6s ease both; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }

    /* BOTÃO VOLTAR */
    .btn-voltar { display:inline-flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-6);
        padding:var(--sp-3) var(--sp-5); font-size:var(--text-sm); font-weight:700; letter-spacing:0.03em;
        border:1px solid rgba(255,255,255,0.22); border-radius:9999px; background:rgba(255,255,255,0.04);
        transition:background var(--t-fast), transform var(--t-fast); }
    .btn-voltar:hover { background:rgba(255,255,255,0.12); transform:translateX(-3px); }

    /* PERFIL */
    .blog-perfil { display:flex; align-items:center; gap:var(--sp-8); padding:var(--sp-10) 0; border-bottom:1px solid var(--color-border); }
    .blog-perfil .prof-avatar { width:clamp(120px,22vw,200px); border-width:3px; }
    .blog-perfil-eyebrow { font-size:var(--text-xs); font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-gray-500); }
    .blog-perfil h1 { font-size:clamp(var(--text-3xl),6vw,var(--text-4xl)); font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin:var(--sp-2) 0; }
    .blog-perfil-materia { display:inline-block; font-size:var(--text-xs); font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
        color:var(--color-gray-300); padding:var(--sp-1) var(--sp-3); border:1px solid rgba(255,255,255,0.14); border-radius:var(--radius-sm); }
    .blog-perfil-desc { margin-top:var(--sp-4); color:var(--color-gray-300); max-width:620px; }

    /* SECTION HEADER (igual ao index) */
    .section-header { display:flex; align-items:center; gap:var(--sp-4); padding:var(--sp-10) 0 var(--sp-6); margin-bottom:var(--sp-6); border-bottom:1px solid var(--color-border); }
    .section-bar { width:4px; height:28px; background:#fff; border-radius:2px; flex-shrink:0; }
    .section-header h2 { font-size:var(--text-2xl); font-weight:800; letter-spacing:-0.02em; }
    .section-header-line { flex:1; height:1px; background:rgba(255,255,255,0.06); }
    .section-tag { font-size:var(--text-xs); font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-gray-500);
        padding:var(--sp-1) var(--sp-3); border:1px solid rgba(255,255,255,0.10); border-radius:var(--radius-sm); }

    /* POSTS */
    .posts-lista { display:flex; flex-direction:column; gap:var(--sp-6); }
    .post { background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--sp-8); }
    .post-meta { display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:center; font-size:var(--text-xs); color:var(--color-gray-500); margin-bottom:var(--sp-3); }
    .post-cat { font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-gray-300);
        padding:2px var(--sp-3); border:1px solid rgba(255,255,255,0.14); border-radius:var(--radius-sm); }
    .post h3 { font-size:var(--text-2xl); font-weight:800; letter-spacing:-0.02em; margin-bottom:var(--sp-4); }
    .post p { color:var(--color-gray-300); margin-bottom:var(--sp-4); max-width:720px; }
    .post p:last-child { margin-bottom:0; }
    .post-autor { display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-5); padding-bottom:var(--sp-4); border-bottom:1px solid var(--color-border); }
    .post-autor .prof-avatar { width:44px; font-size:0.95rem; border-width:2px; }
    .post-autor-nome { font-size:var(--text-sm); font-weight:700; line-height:1.3; }
    .post-autor-cargo { font-size:var(--text-xs); color:var(--color-gray-500); }
    .post-num { margin-left:auto; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
    .post p { font-size:var(--text-base); line-height:1.8; }
    .vazio { color:var(--color-gray-300); padding:var(--sp-6) 0; }

    /* RODAPÉ */
    .site-footer { background:var(--color-surface-1); border-top:1px solid var(--color-border); padding:var(--sp-8) 0; margin-top:var(--sp-16); }
    .footer-bottom { max-width:var(--max-w); margin:0 auto; padding:0 var(--sp-6); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--sp-3); }
    .footer-bottom p { font-size:var(--text-xs); color:var(--color-gray-500); }

    @media (max-width:768px) {
        :root { --nav-h:58px; }
        .nav-links { display:none; }
        .nav-hamburger { display:flex; }
        .blog-perfil { flex-direction:column; text-align:center; gap:var(--sp-5); }
        .blog-perfil-desc { margin-left:auto; margin-right:auto; }
        .post { padding:var(--sp-5); }
        .section-tag { display:none; }
    }
    </style>
</head>
<body>

<header class="site-header" id="site-header">
    <div class="nav-inner">
        <a href="index Eter news.html" class="nav-logo">
            <img src="https://i.ibb.co/39Bkx3KJ/20250322-195214.png" alt="Eter News">
            <span class="nav-logo-text">ETER NEWS</span>
        </a>
        <nav class="nav-links">
            <a href="Área de Estudo.html">Estudos</a>
            <a href="Avisos eter.html">Avisos</a>
            <a href="+ETER.html">+Eter</a>
            <a href="esportes EterNews.html">Esportes</a>
            <a href="Sobre Nos.html">Sobre Nós</a>
            <a href="CONTAGEM.html">Agenda</a>
            <a href="Historia da Eter.html">História</a>
            <a href="Bem-estar.html">Bem-Estar</a>
            <a href="jogos.html">Jogos</a>
        </nav>
        <button class="nav-hamburger" id="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
</header>
<nav class="nav-mobile-panel" id="mobile-panel">
    <a href="Área de Estudo.html">Estudos</a>
    <a href="Avisos eter.html">Avisos</a>
    <a href="+ETER.html">+Eter</a>
    <a href="esportes EterNews.html">Esportes</a>
    <a href="Sobre Nos.html">Sobre Nós</a>
    <a href="CONTAGEM.html">Agenda</a>
    <a href="Historia da Eter.html">História</a>
    <a href="Bem-estar.html">Bem-Estar</a>
    <a href="jogos.html">Jogos</a>
</nav>

<main>
    <div class="layout-container">
        <a href="index Eter news.html#blogs-professores" class="btn-voltar" id="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>
        <div id="blog-conteudo"></div>
        <div class="section-header">
            <div class="section-bar"></div>
            <h2>OUTROS BLOGS DOS PROFESSORES</h2>
            <div class="section-header-line"></div>
            <span class="section-tag">Continue explorando</span>
        </div>
        <div class="prof-grid" id="outros-grid"></div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-bottom">
        <p>© ETER NEWS — ETE República / FAETEC</p>
        <p>Blogs dos Professores</p>
    </div>
</footer>

<script src="professores.js"></script>
<script>
(function () {
    'use strict';
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

    function formatarData(iso) {
        const d = new Date(iso + "T12:00:00");
        return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
    }

    function renderPost(p, prof, i, total) {
        const art = el("article", "post animar");
        art.id = "publicacao-" + (i + 1);
        const autor = el("div", "post-autor");
        const quem = el("div");
        quem.append(el("div", "post-autor-nome", prof.nome), el("div", "post-autor-cargo", profCargo(prof)));
        autor.append(profAvatar(prof), quem);
        const meta = el("div", "post-meta");
        if (p.categoria) meta.appendChild(el("span", "post-cat", p.categoria));
        if (p.data) meta.appendChild(el("span", "", formatarData(p.data)));
        if (total > 1) meta.appendChild(el("span", "post-num", "Publicação " + (i + 1) + " de " + total));
        art.append(autor, meta, el("h3", "", p.titulo));
        String(p.conteudo || "").split(/\n\s*\n/).forEach(par => art.appendChild(el("p", "", par.trim())));
        return art;
    }

    function render() {
        const id = new URLSearchParams(location.search).get("professor");
        const prof = professores.find(p => p.id === id);
        const alvo = document.getElementById("blog-conteudo");
        alvo.replaceChildren();

        if (!prof) {
            document.title = "Blogs dos Professores — ETER NEWS";
            const h = el("div", "section-header");
            h.append(el("div", "section-bar"), el("h2", "", "BLOGS DOS PROFESSORES"));
            alvo.append(h, el("p", "vazio", id ? "Professor não encontrado. Escolha um dos blogs abaixo." : "Escolha um professor abaixo para ler seu blog."));
            profRenderGrid(document.getElementById("outros-grid"), professores);
            return;
        }

        document.title = prof.nome + " — Blogs dos Professores — ETER NEWS";
        const perfil = el("section", "blog-perfil animar");
        const info = el("div");
        info.append(el("p", "blog-perfil-eyebrow", prof.genero === "f" ? "Blog da professora" : "Blog do professor"), el("h1", "", prof.nome),
                    el("span", "blog-perfil-materia", profCargo(prof)));
        if (prof.descricao) info.appendChild(el("p", "blog-perfil-desc", prof.descricao));
        perfil.append(profAvatar(prof), info);

        const h = el("div", "section-header");
        h.append(el("div", "section-bar"), el("h2", "", "PUBLICAÇÕES"), el("div", "section-header-line"),
                 el("span", "section-tag", prof.materia));
        const lista = el("div", "posts-lista");
        if (prof.posts && prof.posts.length) prof.posts.forEach((p, i) => lista.appendChild(renderPost(p, prof, i, prof.posts.length)));
        else lista.appendChild(el("p", "vazio", (prof.genero === "f" ? "Esta professora ainda não publicou" : "Este professor ainda não publicou") + " conteúdos."));

        alvo.append(perfil, h, lista);
        profRenderGrid(document.getElementById("outros-grid"), professores.filter(p => p.id !== prof.id));
    }

    /* Troca de professor sem recarregar a página */
    document.getElementById("outros-grid").addEventListener("click", e => {
        const a = e.target.closest("a.prof-card");
        if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        history.pushState(null, "", a.getAttribute("href"));
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
    window.addEventListener("popstate", render);
    render();

    /* Navbar + menu mobile (igual ao index) */
    const header = document.getElementById("site-header");
    window.addEventListener("scroll", () => header.classList.toggle("scrolled", window.scrollY > 40), { passive: true });
    const burger = document.getElementById("hamburger"), panel = document.getElementById("mobile-panel");
    burger.addEventListener("click", () => {
        const open = panel.classList.toggle("open");
        burger.classList.toggle("open", open);
        burger.setAttribute("aria-expanded", open);
    });
})();
</script>
</body>
</html>
