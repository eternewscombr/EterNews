<script>
const $=i=>document.getElementById(i),v=i=>parseFloat($(i).value);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>typeof n!='number'||!isFinite(n)?'Erro':String(+n.toPrecision(12));
const fp=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2}),r$=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fm=x=>typeof x=='number'?fp(x):x;
const ls=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},ss=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[R(0,a.length-1)],sh=a=>[...a].sort(()=>Math.random()-.5);

/* ===== Avaliador seguro de expressões (sem eval) ===== */
const F={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,cbrt:Math.cbrt,log:Math.log10,ln:Math.log,abs:Math.abs,exp:Math.exp};
let DEG=false;
function ev(s,vr={}){
 s=s.toLowerCase().replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'').replace(/^y=/,'');
 const T=s.match(/(?:\d*\.)?\d+(?:e[+-]?\d+)?|[a-z]+|[-+*/^()%!]/g)||[];
 if(T.join('')!==s)throw Error('x');
 let i=0;const pe=()=>T[i],nx=()=>T[i++],isv=t=>t&&/^[\d.a-z(]/.test(t);
 function E(){let a=M();while(pe()=='+'||pe()=='-'){const o=nx(),b=M();a=o=='+'?a+b:a-b}return a}
 function M(){let a=U();for(;;){const t=pe();if(t=='*'||t=='/'){nx();const b=U();a=t=='*'?a*b:a/b}else if(isv(t))a*=U();else return a}}
 function U(){if(pe()=='-'){nx();return-U()}if(pe()=='+'){nx();return U()}let a=P();if(pe()=='^'){nx();a=Math.pow(a,U())}return a}
 function P(){const t=nx();let a;if(t==undefined)throw Error('x');
  if(t=='('){a=E();if(nx()!=')')throw Error('x')}
  else if(/^[\d.]/.test(t))a=parseFloat(t);
  else if(F[t]){if(nx()!='(')throw Error('x');const x=E();if(nx()!=')')throw Error('x');const tr=t=='sin'||t=='cos'||t=='tan';a=F[t](tr&&DEG?x*Math.PI/180:x);if(t.length==4&&t[0]=='a'&&DEG)a=a*180/Math.PI}
  else if(t=='pi')a=Math.PI;else if(t=='e')a=Math.E;else if(t in vr)a=vr[t];else throw Error('x');
  while(pe()=='%'||pe()=='!'){if(nx()=='%')a/=100;else{let f=1;for(let k=2;k<=a;k++)f*=k;a=f}}
  return a}
 const r=E();if(i<T.length)throw Error('x');return r}

/* ===== Calculadoras ===== */
const H={b:[],s:[]};
function calcP(sci){const id=sci?'s':'b',K=sci?['sin(','cos(','tan(','^','asin(','acos(','atan(','sqrt(','log(','ln(','π','e','(',')','!','DEG']:[],
 B=['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','00','='];
 return `<div class=two><div><input id=${id}d placeholder="0" onkeydown="if(event.key=='Enter')kp('${id}','=')"><div class=keys>${[...K,...B].map(k=>`<button class="btn ${k=='='?'p':''}" onclick="kp('${id}','${k}',this)">${k=='DEG'?'RAD':k}</button>`).join('')}</div></div><div><b>Histórico</b><div id=${id}h class=res style="font-weight:400;max-height:340px;overflow:auto">Nenhum cálculo ainda.</div></div></div>`}
function kp(id,k,b){const d=$(id+'d');
 if(k=='DEG'){DEG=!DEG;b.textContent=DEG?'DEG':'RAD';return}
 if(k=='C')d.value='';else if(k=='⌫')d.value=d.value.slice(0,-1);
 else if(k=='='){try{const r=fmt(ev(d.value));if(r=='Erro')throw 1;H[id].unshift(esc(d.value)+' = <b>'+r+'</b>');$(id+'h').innerHTML=H[id].map(x=>`<div style="padding:4px 0;border-bottom:1px solid var(--b)">${x}</div>`).join('');d.value=r}catch(e){d.value='Erro'}}
 else{if(d.value=='Erro')d.value='';d.value+=k}d.focus()}

/* ===== Conversor ===== */
const U={Comprimento:{mm:.001,cm:.01,m:1,km:1000,in:.0254,ft:.3048,yd:.9144,mi:1609.344},Massa:{mg:1e-6,g:.001,kg:1,t:1000,oz:.0283495,lb:.45359237},Tempo:{s:1,min:60,h:3600,dia:86400},Temperatura:{'°C':0,'°F':0,K:0},Velocidade:{'km/h':1/3.6,'m/s':1,'mph':.44704},Volume:{mL:.001,L:1,'m³':1000,gal:3.78541}};
function cvCat(){const us=Object.keys(U[$('cvc').value]),o=us.map(k=>`<option>${k}</option>`).join('');$('cvf').innerHTML=o;$('cvt').innerHTML=o;$('cvt').selectedIndex=Math.min(1,us.length-1);cvUp()}
function cvUp(){const c=$('cvc').value,a=$('cvf').value,b=$('cvt').value,x=v('cvv');let r;
 if(c=='Temperatura'){const C=a=='°C'?x:a=='°F'?(x-32)*5/9:x-273.15;r=b=='°C'?C:b=='°F'?C*9/5+32:C+273.15}else r=x*U[c][a]/U[c][b];
 $('cvr').textContent=isNaN(r)?'Digite um valor':`${x} ${a} = ${fmt(+r.toFixed(8))} ${b}`}
function cvSw(){const a=$('cvf').value;$('cvf').value=$('cvt').value;$('cvt').value=a;cvUp()}

/* ===== Gráficos ===== */
function gl(a,b,f){const s=Math.max(1,Math.ceil((b-a)/20));for(let k=Math.ceil(a/s)*s;k<=b;k+=s)f(k)}
function plot(c,fs,x0,x1){const g=c.getContext('2d'),W=c.width,H2=c.height,ys=[];g.fillStyle='#111';g.fillRect(0,0,W,H2);
 fs.forEach(f=>{for(let k=0;k<=200;k++){try{const y=f(x0+(x1-x0)*k/200);if(isFinite(y))ys.push(y)}catch(e){}}});
 let y0=Math.min(...ys,0),y1=Math.max(...ys,0);if(y1-y0<1){y0-=1;y1+=1}const p=(y1-y0)*.1;y0-=p;y1+=p;
 const X=x=>(x-x0)/(x1-x0)*W,Y=y=>H2-(y-y0)/(y1-y0)*H2;g.font='11px Inter';g.fillStyle='#888';g.strokeStyle='#2a2a2a';g.beginPath();
 gl(x0,x1,k=>{g.moveTo(X(k),0);g.lineTo(X(k),H2)});gl(y0,y1,k=>{g.moveTo(0,Y(k));g.lineTo(W,Y(k))});g.stroke();
 gl(x0,x1,k=>k&&g.fillText(k,X(k)+2,Math.min(Math.max(Y(0)-3,10),H2-3)));gl(y0,y1,k=>k&&g.fillText(k,Math.min(Math.max(X(0)+3,0),W-24),Y(k)-2));
 g.strokeStyle='#888';g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H2);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
 fs.forEach((f,j)=>{g.strokeStyle=['#f0b429','#38bdf8','#4ade80'][j%3];g.lineWidth=2;g.beginPath();let on=0;for(let k=0;k<=500;k++){const x=x0+(x1-x0)*k/500;let y;try{y=f(x)}catch(e){y=NaN}if(isFinite(y)&&Math.abs(Y(y))<H2*4){on?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));on=1}else on=0}g.stroke()});g.lineWidth=1}
function grUp(){const ss2=$('gf').value.split(';').map(s=>s.trim()).filter(Boolean),x0=v('gx0'),x1=v('gx1'),xv=v('gxv');
 if(!ss2.length||isNaN(x0)||isNaN(x1)||x1<=x0){$('gm').innerHTML='<span class=bad>Confira a função e o intervalo de x.</span>';return}
 try{ss2.forEach(s=>ev(s,{x:1}))}catch(e){$('gm').innerHTML='<span class=bad>Função inválida. Exemplos: x², 2x+1, sin(x), sqrt(x), 1/x</span>';return}
 plot($('gc'),ss2.map(s=>x=>ev(s,{x})),x0,x1);
 $('gm').innerHTML=isNaN(xv)?'':ss2.map(s=>`<div class=res>${esc(s.startsWith('y')?s:'y = '+s)} → para x = ${xv}: y = ${fmt(ev(s,{x:xv}))}</div>`).join('')}

/* ===== Porcentagem (inclui INSS e média ponderada) ===== */
const PM={inc:['Aumento percentual',['Valor original','Porcentagem (%)'],[1000,10],(a,b)=>[['Valor final',r$(a*(1+b/100))],['Aumento',r$(a*b/100)]]],
 dec:['Redução / desconto',['Valor original','Porcentagem (%)'],[1000,10],(a,b)=>[['Valor final',r$(a*(1-b/100))],['Desconto',r$(a*b/100)]]],
 of:['Quanto é X% de Y',['Porcentagem (%)','Valor'],[20,250],(a,b)=>[['Resultado',fmt(a*b/100)]]],
 ratio:['Quantos % uma parte é do total',['Valor parcial','Valor total'],[50,200],(a,b)=>[['Porcentagem',fmt(+(a/b*100).toFixed(4))+'%']]],
 inss:['Cálculo de INSS',['Salário bruto (R$)'],[3000],s=>{let p=0,t=0;for(const[l,r]of[[1320,.075],[2571.29,.09],[3856.94,.12],[7507.49,.14]]){if(s>p)t+=(Math.min(s,l)-p)*r;p=l}return[['Desconto INSS',r$(t)],['Salário líquido',r$(s-t)],['Alíquota efetiva',s>0?fp(t/s*100)+'%':'—']]}],
 weighted:['Nota com peso',['Nota 1','Peso 1','Nota 2','Peso 2'],[7.5,2,8,3],(a,b,c,d)=>[['Média ponderada',fmt(+((a*b+c*d)/(b+d)).toFixed(4))],['Soma dos pesos',b+d]]]};
function pmR(){const m=PM[$('pm').value];$('pi').innerHTML=m[1].map((l,i)=>`<label>${l}<input id=p${i} type=number step=any value=${m[2][i]} oninput=pmC()></label>`).join('');pmC()}
function pmC(){const m=PM[$('pm').value],a=m[1].map((_,i)=>v('p'+i));$('pr').innerHTML=a.some(isNaN)?'Preencha os campos':m[3](...a).map(([l,x])=>`<div class=res>${l}: ${x}</div>`).join('')}

/* ===== Consumo elétrico ===== */
function enC(){const P=v('ep'),h=v('eh'),d=v('ed'),t=v('et'),k=P*h/1000;$('er2').innerHTML=[P,h,d,t].some(isNaN)?'Preencha os campos':[['Consumo diário',fp(k)+' kWh'],['Consumo mensal',fp(k*d)+' kWh'],['Custo diário',r$(k*t)],['Custo mensal',r$(k*d*t)]].map(([l,x])=>`<div class=res>${l}: ${x}</div>`).join('')}

/* ===== Matrizes ===== */
const mp=t=>t.trim().split('\n').map(r=>r.trim().split(/\s+/).map(Number)),det=m=>m.length==1?m[0][0]:m[0].reduce((s,x,j)=>s+(j%2?-1:1)*x*det(m.slice(1).map(r=>r.filter((_,k)=>k!=j))),0),
 mtx=M=>'<table>'+M.map(r=>'<tr>'+r.map(x=>'<td>'+fmt(x)+'</td>').join('')+'</tr>').join('')+'</table>';
function mxRun(){try{const A=mp($('ma').value),B=mp($('mb').value),o=$('mo').value;let X;
 if(o=='+'||o=='-'){if(A.length!=B.length||A[0].length!=B[0].length)throw Error('As matrizes precisam ter o mesmo tamanho.');X=A.map((r,i)=>r.map((x,j)=>o=='+'?x+B[i][j]:x-B[i][j]))}
 else if(o=='*'){if(A[0].length!=B.length)throw Error('Nº de colunas de A deve ser igual ao nº de linhas de B.');X=A.map(r=>B[0].map((_,j)=>r.reduce((s,x,k)=>s+x*B[k][j],0)))}
 else if(o=='t')X=A[0].map((_,j)=>A.map(r=>r[j]));
 else{if(A.length!=A[0].length)throw Error('O determinante exige matriz quadrada.');X=[[det(A)]]}
 if(X.flat().some(isNaN))throw Error('Use apenas números separados por espaço.');$('mr').innerHTML=mtx(X)}catch(e){$('mr').innerHTML='<span class=bad>'+esc(e.message)+'</span>'}}

/* ===== Equações ===== */
function eqRun(){const g=$('eg').value,a=v('ea'),b=v('eb'),c=v('ec');let h;
 if([a,b].some(isNaN)||(g=='2'&&isNaN(c)))h='Preencha os campos';else if(a==0)h='O coeficiente a deve ser diferente de zero.';
 else if(g=='1')h=`${a}x + ${b} = 0<br>x = −b/a = <b>${fmt(-b/a)}</b>`;
 else{const d=b*b-4*a*c;h=`Δ = b² − 4ac = ${fmt(d)}<br>`+(d<0?'Δ &lt; 0: não há raízes reais.':d==0?`Raiz dupla: x = −b/2a = <b>${fmt(-b/(2*a))}</b>`:`x₁ = <b>${fmt((-b+Math.sqrt(d))/(2*a))}</b><br>x₂ = <b>${fmt((-b-Math.sqrt(d))/(2*a))}</b>`)}
 $('er').innerHTML='<div class=res>'+h+'</div>'}

/* ===== Geometria (2D, ângulos e sólidos 3D) ===== */
const GEO={'Quadrado':[['Lado'],a=>[['Área',a[0]**2],['Perímetro',4*a[0]]]],'Retângulo':[['Base','Altura'],a=>[['Área',a[0]*a[1]],['Perímetro',2*(a[0]+a[1])]]],
 'Triângulo':[['Base','Altura','Lado 1','Lado 2','Lado 3'],a=>[['Área',a[0]*a[1]/2],['Perímetro',a[2]+a[3]+a[4]]]],'Círculo':[['Raio'],a=>[['Área',Math.PI*a[0]**2],['Circunferência',2*Math.PI*a[0]]]],
 'Trapézio':[['Base maior','Base menor','Altura'],a=>[['Área',(a[0]+a[1])*a[2]/2]]],'Polígono regular (ângulos)':[['Nº de lados','Lado'],a=>[['Soma dos ângulos internos',(a[0]-2)*180+'°'],['Cada ângulo interno',fp((a[0]-2)*180/a[0])+'°'],['Perímetro',a[0]*a[1]]]],
 'Cubo':[['Aresta'],a=>[['Volume',a[0]**3],['Área total',6*a[0]**2]]],'Paralelepípedo':[['a','b','c'],a=>[['Volume',a[0]*a[1]*a[2]],['Área total',2*(a[0]*a[1]+a[0]*a[2]+a[1]*a[2])]]],
 'Esfera':[['Raio'],a=>[['Volume',4/3*Math.PI*a[0]**3],['Área',4*Math.PI*a[0]**2]]],'Cilindro':[['Raio','Altura'],a=>[['Volume',Math.PI*a[0]**2*a[1]],['Área total',2*Math.PI*a[0]*(a[0]+a[1])]]],
 'Cone':[['Raio','Altura'],a=>{const g=Math.hypot(a[0],a[1]);return[['Geratriz',g],['Volume',Math.PI*a[0]**2*a[1]/3],['Área total',Math.PI*a[0]*(a[0]+g)]]}]};
function geS(){const g=GEO[$('gs').value];$('gi').innerHTML=g[0].map((l,i)=>`<label>${l}<input id=g${i} type=number step=any value=${i+3} oninput=geC()></label>`).join('');geC()}
function geC(){const g=GEO[$('gs').value],a=g[0].map((_,i)=>v('g'+i));$('gr2').innerHTML=a.some(isNaN)?'Preencha os campos':g[1](a).map(([l,x])=>`<div class=res>${l}: ${fm(x)}</div>`).join('')}

/* ===== Caderno ===== */
const nbS=()=>ss('ff_nb',$('nbt').value);

/* ===== Mini motor SQL (CREATE, DROP, INSERT, SELECT, UPDATE, DELETE, WHERE, AND/OR, LIKE, JOIN, GROUP BY, ORDER BY, LIMIT) ===== */
const mk=(c,rows)=>({c,r:rows.map(a=>Object.fromEntries(c.map((k,i)=>[k,a[i]])))});
function val(x){x=x.trim();if(/^'.*'$/s.test(x))return x.slice(1,-1);if(/^-?\d+(\.\d+)?$/.test(x))return+x;if(/^null$/i.test(x))return null}
function cond(w){const ors=w.split(/\s+or\s+/i).map(o=>o.split(/\s+and\s+/i).map(c=>{const m=c.trim().match(/^([\w.]+)\s*(<=|>=|<>|!=|=|<|>|like)\s*(.+)$/is);if(!m)throw Error('Condição inválida: '+c);const x=val(m[3]);if(x===undefined)throw Error("Valor inválido em '"+c.trim()+"' (texto precisa de aspas simples)");return[m[1],m[2].toLowerCase(),x]}));
 return r=>ors.some(a=>a.every(([k,o,x])=>{if(!(k in r))throw Error('Coluna desconhecida: '+k);const y=r[k];
  switch(o){case'=':return y==x;case'<>':case'!=':return y!=x;case'<':return y<x;case'>':return y>x;case'<=':return y<=x;case'>=':return y>=x;
  default:return new RegExp('^'+String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.')+'$','i').test(y)}}))}
function sql(db,q){q=q.trim().replace(/;+\s*$/,'');let m;const T=n=>{n=n.toLowerCase();if(!db[n])throw Error('Tabela não existe: '+n);return db[n]};
 if(m=q.match(/^create\s+table\s+(\w+)\s*\((.+)\)$/is)){const n=m[1].toLowerCase();if(db[n])throw Error('A tabela '+n+' já existe');db[n]={c:m[2].split(',').map(s=>s.trim().split(/\s+/)[0].toLowerCase()),r:[]};return{msg:'Tabela '+n+' criada',t:n}}

 else if(i<7){const n=pk([100,200,300,500]),p=pk([10,15,20,25]);c=n*(1-p/100);f=r$;t=`Um produto custa ${r$(n)} e recebeu ${p}% de desconto. Qual é o novo preço?`;e=`Desconto: ${p}% de ${n} = ${r$(n*p/100)}. Novo preço: ${r$(n)} − ${r$(n*p/100)} = ${r$(c)}.`}
 else if(i<9){const n=pk([20,40,50,60]),p=pk([10,20,30,40,50]);c=n*p/100;t=`Uma turma tem ${n} alunos. ${p}% faltaram. Quantos alunos faltaram?`;e=`${p}% de ${n} = ${fp(c)} alunos.`}
 else{const n=pk([150,200,400,800]),p=pk([10,20,30]);c=n*(1+p/100);f=r$;t=`Um salário de ${r$(n)} recebeu aumento de ${p}%. Qual é o novo valor?`;e=`Aumento: ${r$(n*p/100)}. Novo valor: ${r$(c)}.`}
 return{t,o:wr(c,f),e}};
const AP=[['TV',100],['Chuveiro',5000],['Ferro de passar',1000],['Lâmpada LED',10],['Ventilador',80],['Micro-ondas',1200],['Computador',300],['Geladeira',150]];
const GEn=i=>{
 if(i<4){const P=pk([60,100,150,200,1000,1500]),h=pk([2,3,4,5,8]),c=P*h/1000;return{t:`Um aparelho de ${P} W fica ligado ${h} horas por dia. Qual é o consumo aproximado em um dia?`,o:wr(c,x=>fp(x)+' kWh'),e:`E = P × t = ${P} W × ${h} h = ${P*h} Wh = ${fp(c)} kWh.`}}
 if(i<7){const P=pk([100,500,1000,1500]),h=pk([2,4,5]),tf=pk([.5,.8,1]),k=P*h/1000*30,c=k*tf;return{t:`Um aparelho de ${P} W é usado ${h} h por dia durante 30 dias. Com tarifa de ${r$(tf)}/kWh, qual é o custo no mês?`,o:wr(c,r$),e:`${P} × ${h} ÷ 1000 × 30 = ${fp(k)} kWh. Custo: ${fp(k)} × ${r$(tf)} = ${r$(c)}.`}}
 let a;do{a=sh(AP).slice(0,4).map(([n,P])=>[n,P,R(1,8)]);const z=a.map(y=>y[1]*y[2]).sort((p,q)=>q-p);if(z[0]!=z[1])break}while(1);
 const b=a.reduce((m,y)=>y[1]*y[2]>m[1]*m[2]?y:m);return{t:'Qual aparelho consome mais energia por dia?',x:'<table><tr><th>Aparelho</th><th>Potência</th><th>Uso por dia</th></tr>'+a.map(y=>`<tr><td>${y[0]}</td><td>${y[1]} W</td><td>${y[2]} h</td></tr>`).join('')+'</table>',o:[b[0],...a.filter(y=>y!=b).map(y=>y[0])],e:'Energia = potência × tempo. '+a.map(y=>`${y[0]}: ${fp(y[1]*y[2]/1000)} kWh`).join(' · ')+'.'}};
const FN=[['y = x',x=>x],['y = x²',x=>x*x],['y = 2x + 1',x=>2*x+1],['y = −x',x=>-x],['y = x + 2',x=>x+2],['y = 2x',x=>2*x],['y = −x²',x=>-x*x],['y = x − 1',x=>x-1]];
const GGr=i=>{const f=pk(FN),cv='<canvas id=qc width=500 height=300 style="width:100%;max-width:500px;border-radius:8px"></canvas>',d=c=>plot(c,[f[1]],-5,5);
 if(i%2==0)return{t:'Qual função corresponde a este gráfico?',x:cv,d,o:[f[0],...sh(FN.filter(z=>z!=f)).slice(0,3).map(z=>z[0])],e:`O gráfico é de ${f[0]}. Teste um ponto: em x = 1, esta função dá y = ${f[1](1)}.`};
 const a=pk([-2,-1,0,1,2,3]),y=f[1](a);return{t:`Este é o gráfico de ${f[0]}. Qual é o valor de Y quando X = ${a}?`,x:cv,d,o:wi(y),e:`Substitua x = ${a} na função ${f[0]}: y = ${y}.`}};
const GGm=i=>{const a=R(2,12),b=R(2,12),r=R(2,6),h=R(2,9),Z=[[`Um retângulo tem base ${a} cm e altura ${b} cm. Qual é a área?`,a*b,`A = base × altura = ${a} × ${b} = ${a*b} cm²`],[`Um retângulo tem lados ${a} cm e ${b} cm. Qual é o perímetro?`,2*(a+b),`P = 2 × (${a} + ${b}) = ${2*(a+b)} cm`],
 [`Um triângulo tem base ${a*2} cm e altura ${b} cm. Qual é a área?`,a*b,`A = base × altura ÷ 2 = ${a*2} × ${b} ÷ 2 = ${a*b} cm²`],[`Um quadrado tem lado ${a} cm. Qual é o perímetro?`,4*a,`P = 4 × ${a} = ${4*a} cm`],
 [`Um cubo tem aresta ${r} cm. Qual é o volume?`,r**3,`V = aresta³ = ${r}³ = ${r**3} cm³`],[`Um paralelepípedo mede ${r} × ${h} × ${b} cm. Qual é o volume?`,r*h*b,`V = ${r} × ${h} × ${b} = ${r*h*b} cm³`],[`Um cilindro tem raio ${r} cm e altura ${h} cm. Qual é o volume? (use π ≈ 3,14)`,+(3.14*r*r*h).toFixed(2),`V = π × r² × h = 3,14 × ${r}² × ${h} = ${fp(3.14*r*r*h)} cm³`]],
 z=pk(Z.slice(...(i<4?[0,2]:i<8?[2,5]:[4,7])));return{t:z[0],o:wr(z[1],fp),e:z[2]}};
const CVL=[['m','cm',100],['km','m',1000],['kg','g',1000],['h','min',60],['min','s',60],['L','mL',1000],['m','mm',1000],['t','kg',1000],['h','s',3600],['g','kg',.001],['cm','m',.01]];
const GCv=i=>{let t,c,u,e;if(i<7){const x=pk([1,2,2.5,3,5,.5]),[a,b,f]=pk(i<4?CVL.slice(0,6):CVL);c=+(x*f).toFixed(4);u=b;t=`${fp(x)} ${a} equivalem a quantos ${b}?`;e=`1 ${a} = ${fp(f)} ${b}; então ${fp(x)} × ${fp(f)} = ${fp(c)} ${b}.`}
 else{const k=R(0,2),x=k<2?pk([0,10,20,25,30,100]):pk([18,36,72,108]);c=k==0?x*9/5+32:k==1?x+273:x/3.6;u=['°F','K','m/s'][k];t=`${x} ${['°C','°C','km/h'][k]} equivalem a quantos ${u}?`;e=['°F = °C × 9/5 + 32','K = °C + 273','Divida km/h por 3,6 para obter m/s'][k]+` → ${fp(c)} ${u}.`}
 return{t,o:wr(c,y=>fp(y)+' '+u),e}};
const mm=()=>[[R(1,9),R(1,9)],[R(1,9),R(1,9)]],ms=M=>'['+M.map(r=>'['+r.join(', ')+']').join(', ')+']',md=(A,B)=>`<div style="display:flex;gap:28px;flex-wrap:wrap"><div>A${mtx(A)}</div><div>B${mtx(B)}</div></div>`;
const mv=M=>[ms(M),...[[0,0,1],[1,1,-1],[0,1,2]].map(([r,c,k])=>{const N=M.map(a=>[...a]);N[r][c]+=k;return ms(N)})];
const GMx=i=>{const A=mm(),B=mm();
 if(i<3){const r=R(1,2),c=R(1,2),y=A[r-1][c-1];return{t:`Qual elemento está na posição [${r},${c}] da matriz A? (linha ${r}, coluna ${c})`,x:md(A,B),o:wi(y),e:`Na linha ${r}, coluna ${c} de A está o número ${y}.`}}
 if(i<7){const S=A.map((p,a)=>p.map((y,b)=>y+B[a][b]));return{t:'Qual é o resultado de A + B?',x:md(A,B),o:mv(S),e:'Some elemento a elemento: '+ms(S)+'.'}}
 if(i%2){const d=A[0][0]*A[1][1]-A[0][1]*A[1][0];return{t:'Qual é o determinante de A?',x:md(A,B),o:wi(d),e:`det = a·d − b·c = ${A[0][0]}·${A[1][1]} − ${A[0][1]}·${A[1][0]} = ${d}.`}}
 const P=A.map(p=>B[0].map((_,b)=>p.reduce((s,y,k)=>s+y*B[k][b],0)));return{t:'Qual é o resultado de A × B?',x:md(A,B),o:mv(P),e:'Cada elemento é linha de A × coluna de B: '+ms(P)+'.'}};
const GMt=i=>{const a=R(2,20),b=R(2,12),c=R(2,9),n=R(3,8),Z=i<4?[[`${a} + ${b}`,a+b],[`${a+b} − ${b}`,a],[`${b} × ${c}`,b*c]]:i<8?[[`${a} + ${b} × ${c}`,a+b*c],[`(${a} + ${b}) × ${c}`,(a+b)*c],[`${a*c} ÷ ${c} + ${b}`,a+b]]:[[`√${c*c} + ${b}²`,c+b*b],[`${c}² − ${b}`,c*c-b],[`2^${n}`,2**n]],z=pk(Z);
 return{t:`Quanto é ${z[0]}?`,o:wi(z[1]),e:`Resultado: ${z[1]}. Ordem: parênteses, potências e raízes, × e ÷, depois + e −.`}};
const GN={'d-mat':GMt,'d-en':GEn,'d-gr':GGr,'d-geo':GGm,'d-conv':GCv,'d-pct':GP,'d-mx':GMx};

/* ===== Páginas das ferramentas ===== */
const inp=(l,d,i,f)=>`<label>${l}<input id=${i} type=number step=any value=${d} oninput=${f}></label>`;
const PH={calc:()=>calcP(0),sci:()=>calcP(1),
 pct:()=>`<label>Tipo de cálculo<select id=pm onchange=pmR()>${Object.entries(PM).map(([k,m])=>`<option value=${k}>${m[0]}</option>`).join('')}</select></label><div id=pi></div><div id=pr></div><p class=m style="font-size:.8rem">Tabela do INSS: valores de 2023, como já estavam no arquivo original.</p>`,
 mat:()=>`<div class=two><label>Matriz A (linhas em linhas, números separados por espaço)<textarea id=ma rows=4>1 2\n3 4</textarea></label><label>Matriz B<textarea id=mb rows=4>5 6\n7 8</textarea></label></div><label>Operação<select id=mo onchange=mxRun()><option value="+">A + B</option><option value="-">A − B</option><option value="*">A × B</option><option value="t">Transposta de A</option><option value="d">Determinante de A</option></select></label><button class="btn p" onclick=mxRun()>Calcular</button><div id=mr class=res></div>`,
 eq:()=>`<label>Tipo<select id=eg onchange=eqRun()><option value=1>1º grau: ax + b = 0</option><option value=2>2º grau: ax² + bx + c = 0</option></select></label><div class=two>${inp('a',1,'ea','eqRun()')}${inp('b',-5,'eb','eqRun()')}${inp('c (só no 2º grau)',6,'ec','eqRun()')}</div><div id=er></div>`,
 nb:()=>`<textarea id=nbt rows=14 oninput=nbS() placeholder="Escreva contas e anotações. Termine uma linha com = para calcular. Ex.: 12*3+4 =">${esc(ls('ff_nb',''))}</textarea><p><button class="btn p" onclick=nbCalc()>Calcular linhas com =</button> <button class=btn onclick="if(confirm('Limpar o caderno?')){$('nbt').value='';nbS()}">Limpar</button></p><p class=m>Salvo automaticamente neste navegador.</p>`,
 conv:()=>`<label>Grandeza<select id=cvc onchange=cvCat()>${Object.keys(U).map(k=>`<option>${k}</option>`).join('')}</select></label>${inp('Valor',1,'cvv','cvUp()')}<div class=two><label>De<select id=cvf onchange=cvUp()></select></label><label>Para<select id=cvt onchange=cvUp()></select></label></div><button class=btn onclick=cvSw()>⇄ Inverter</button><div id=cvr class=res></div>`,
 en:()=>inp('Potência do aparelho (W)',1500,'ep','enC()')+inp('Horas de uso por dia',2,'eh','enC()')+inp('Dias de uso por mês',30,'ed','enC()')+inp('Tarifa (R$/kWh)',.75,'et','enC()')+'<div id=er2></div>',
 geo:()=>`<label>Figura<select id=gs onchange=geS()>${Object.keys(GEO).map(k=>`<option>${k}</option>`).join('')}</select></label><div id=gi></div><div id=gr2></div>`,
 gr:()=>`<div class=two><div><label>Função(ões) — separe várias com ;<input id=gf value="y = x²" oninput=grUp()></label><div class=two>${inp('x mínimo',-5,'gx0','grUp()')}${inp('x máximo',5,'gx1','grUp()')}</div>${inp('Calcular y para x =',2,'gxv','grUp()')}<div id=gm></div></div><canvas id=gc width=640 height=420 style="width:100%;border-radius:8px"></canvas></div>`,
 bd:()=>`<div class=two style="grid-template-columns:2fr 1fr"><div><textarea id=sq rows=5 onkeydown="if(event.ctrlKey&&event.key=='Enter')bdRun()">SELECT * FROM clientes;</textarea><p><button class="btn p" onclick=bdRun()>▶ Executar (Ctrl+Enter)</button> <button class=btn onclick=bdReset()>Restaurar banco</button></p><select onchange="if(this.selectedIndex){$('sq').value=this.value;this.selectedIndex=0}"><option>Exemplos de comandos…</option>${EX.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select><div id=bdr class=res style="font-weight:400"></div></div><div><b>Tabelas (clique para ver)</b><div id=bdt></div></div></div>`};
const PI={pct:pmR,conv:cvCat,en:enC,geo:geS,gr:grUp,mat:mxRun,eq:eqRun,bd:()=>{bdLoad();bdTabs()}};

/* ===== Menu, cards e rotas ===== */
const FER=[['🧮 Matemática',[['calc','🔢','Calculadora de 4 operações','Soma, subtração, multiplicação e divisão'],['sci','🧮','Calculadora científica','sen, cos, tan, log, raiz, potência, π e e'],['pct','％','Porcentagem','Aumento, desconto, INSS e média ponderada'],['mat','🔷','Matrizes','Soma, produto, transposta e determinante'],['eq','✏️','Equações','1º e 2º grau com Δ'],['nb','📓','Caderno','Anote contas e continue depois']]],
 ['🔬 Ciências',[['conv','🔄','Conversor de unidades','Comprimento, massa, tempo, temperatura, velocidade e volume']]],
 ['⚡ Elétrica',[['en','⚡','Consumo elétrico','kWh por dia e por mês, e o custo na conta']]],
 ['📐 Geometria',[['geo','📐','Geometria','Áreas, perímetros, ângulos e volumes (cubo, esfera, cilindro, cone…)']]],
 ['📊 Gráficos',[['gr','📈','Calculadora gráfica','Digite y = x² e veja o gráfico']]],
 ['💾 Banco de Dados',[['bd','💾','Laboratório SQL','Crie tabelas, insira, consulte, filtre e ordene']]]];
const DES=[['d-mat','🧮','Desafio de Matemática','Operações e expressões'],['d-en','⚡','Desafio de Consumo Elétrico','Potência × tempo'],['d-gr','📊','Desafio de Gráficos','Identifique funções e valores'],['d-sql','💾','Desafio SQL','Consultas, JOIN e erros — 4 níveis'],['d-geo','📐','Desafio de Geometria','Áreas, perímetros e volumes'],['d-conv','🔄','Desafio de Conversão','Unidades do dia a dia'],['d-pct','🔢','Desafio de Porcentagem','Descontos e proporções'],['d-mx','🔷','Desafio de Matrizes','Soma, posição e determinante']];
const card=c=>`<div class=card onclick="location.hash='${c[0]}'"><i>${c[1]}</i><b>${c[2]}</b><small>${c[3]}</small></div>`;
function route(){clearInterval(TM);const h=location.hash.slice(1),a=$('app');
 if(!h||h=='d'){a.innerHTML=`<div class=tabs><button class="btn ${h?'':'on'}" onclick="location.hash=''">🛠️ Ferramentas</button><button class="btn ${h?'on':''}" onclick="location.hash='d'">🎮 Desafios</button></div>`+
  (h?`<p class=m>Teste seus conhecimentos e ganhe pontos. As calculadoras ficam na aba Ferramentas.</p><div class=grid>${DES.map(card).join('')}</div>`:FER.map(c=>`<h3 class=cat>${c[0]}</h3><div class=grid>${c[1].map(card).join('')}</div>`).join(''));return}
 const it=[...FER.flatMap(c=>c[1]),...DES].find(x=>x[0]==h);if(!it){location.hash='';return}
 a.innerHTML=`<button class=btn onclick="location.hash='${h[1]=='-'?'d':''}'">← Voltar</button><h2>${it[1]} ${it[2]}</h2><div id=pn class=panel></div>`;
 if(PH[h]){$('pn').innerHTML=PH[h]();PI[h]&&PI[h]()}
 else if(h=='d-sql')$('pn').innerHTML='<p>Escolha como jogar. Cada rodada tem até 10 perguntas de múltipla escolha.</p>'+[[0,'🎯 Progressivo — mistura os níveis, do fácil ao difícil'],[1,'Nível 1 — SELECT, FROM, WHERE, ORDER BY, INSERT'],[2,'Nível 2 — UPDATE, DELETE, AND, OR, LIKE, LIMIT'],[3,'Nível 3 — COUNT, AVG, SUM, GROUP BY, JOIN'],[4,'Avançado — JOINs, agrupamentos, resultados e erros']].map(([l,t])=>`<button class="btn opt" onclick="sqlStart(${l})">${t}</button>`).join('');
 else quiz(GN[h],10)}
window.onhashchange=route;route();
</script></body></html>
